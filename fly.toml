# fly.toml app configuration file generated for KETAWEBSITE
app = "ketawebsite"
primary_region = "lhr"

[build]
  builder = "dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "3000"
